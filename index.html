<!DOCTYPE html>

<title>VocalFlash - Basta sbobbinare. Leggilo.</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif; background:#fcfcfd; color:#111;}
.header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:white;border-bottom:1px solid #f3f4f6;max-width:100%;}
.header-left{display:flex;align-items:center;gap:8px}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none;color:#111;font-weight:700;font-size:15px;letter-spacing:-0.2px}
.logo img{width:38px;height:38px;border-radius:10px}
.nav{display:flex;align-items:center;gap:14px;font-size:14px;font-weight:500}
.nav a{text-decoration:none;color:#111;}
.btn-login{background:linear-gradient(135deg,#8b5cf6 0%,#ec4899 100%);color:white;padding:12px 22px;border-radius:14px;text-decoration:none;font-weight:700;font-size:16px;box-shadow:0 4px 14px rgba(139,92,246,0.3)}

.hero{text-align:center;padding:56px 20px 20px;max-width:600px;margin:0 auto}
.hero h1{font-size:58px;font-weight:900;letter-spacing:-2.5px;line-height:0.95;margin-bottom:16px}
.hero h1 .black{color:#0a0a0a;display:block}
.hero h1 .gradient{background:linear-gradient(90deg,#8b5cf6 0%,#a855f7 30%,#ec4899 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;display:block;margin-top:2px}
.hero .sub{color:#6b7280;font-size:18px;line-height:1.5;margin:28px auto 0;max-width:340px;font-weight:400}
.cta-main{background:linear-gradient(135deg,#8b5cf6 0%,#ec4899 100%);color:white;padding:20px 10px;width:100%;max-width:380px;border-radius:18px;text-decoration:none;font-weight:800;font-size:18px;display:inline-block;margin-top:32px;box-shadow:0 16px 32px rgba(139,92,246,0.28);letter-spacing:-0.2px}

/* demo sotto come avevi tu */
.demo{max-width:420px;margin:48px auto 0;padding:0 16px}
.demo-box{border:2px dashed #a78bfa;border-radius:20px;padding:20px;background:white}
.demo h2{text-align:center;font-size:20px;font-weight:800}
</style>
</head>
<body>

<div class="header">
<div class="header-left">
<a href="/" class="logo"><img src="logo.webp" alt="VocalFlash"> vocalflash.it</a>
<div class="nav"><a href="#come-funziona">Come funziona</a><a href="#prezzi">Prezzi</a></div>
</div>
<a href="https://wa.me/" class="btn-login" target="_blank">Login</a>
</div>

<div class="hero">
<h1><span class="black">Basta</span><span class="black">sbobinare.</span><span class="gradient">Leggilo.</span></h1>
<p class="sub">Trasforma 2 minuti di vocale in 3 righe.<br>Veloce, in italiano, su WhatsApp.<br>Nessuna app da installare.</p>
<a href="https://wa.me/" class="cta-main" target="_blank">Provalo su WhatsApp - Gratis</a>
</div>

<div class="demo">
<div class="demo-box">
<h2>Da vocale infinito a sintesi in 2 secondi 👇</h2>
</div>
</div>

</body>
</html>
