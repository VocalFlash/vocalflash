name: Bird SMS Hook Tests

on:
  push:
    branches:
      - auth-bird-sms-hook-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bird-sms-hook-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run isolated SMS hook tests
        run: deno test --allow-net supabase/functions/send-sms/index_test.ts
