name: Assistant Customer Pipeline Tests

on:
  push:
    branches:
      - assistant-conversation-photo-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  customer-pipeline-tests:
    name: Assistant API pass ${{ matrix.pass }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        pass: [1, 2, 3, 4, 5]
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Validate draft professional terminology catalog
        run: node scripts/validate-professional-terminology-catalog.mjs
      - name: Run focused assistant tests
        run: node --test lib/audio-assistant-event-normalizer-v1.test.js api/v1/assistant.test.js lib/supabase-rest-headers-v1.test.js lib/assistant-readiness-v1.test.js lib/new-work-required-data-extractor-v1.test.js lib/customer-assistant-reply-v1.test.js lib/customer-whatsapp-pipeline-v1.test.js lib/business-vocabulary-context-v1.test.js lib/request-classifier-validation-v2.test.js lib/new-work-intake-plan-v1.test.js lib/new-work-creation-policy-v1.test.js lib/owner-command-runtime-v1.test.js lib/owner-command-confirmation-v1.test.js lib/assistant-whatsapp-dispatch-v1.test.js
