name: Assistant Customer Pipeline Tests

on:
  pull_request:
    branches:
      - assistant-auth-v1
  push:
    branches:
      - assistant-conversation-photo-v1

permissions:
  contents: read

jobs:
  customer-pipeline-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Run focused assistant tests
        run: node --test lib/new-work-required-data-extractor-v1.test.js lib/customer-assistant-reply-v1.test.js
